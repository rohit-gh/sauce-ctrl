[package]
name = "sauce-ctrl"
version = "0.1.0"
description = "SauceCtrl — a local Git GUI, Git but pleasant."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
